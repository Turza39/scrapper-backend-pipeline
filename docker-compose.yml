services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: scraper-backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
    volumes:
      - .:/app
    networks:
      - scraper-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: scraper-frontend
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - scraper-network

  nginx:
    image: nginx:alpine
    container_name: scraper-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - scraper-network

networks:
  scraper-network:
    driver: bridge
